<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gingham pattern -->
    <pattern id="gingham" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="6" height="6" fill="#E8F4FF"/>
      <rect x="6" y="6" width="6" height="6" fill="#E8F4FF"/>
      <rect x="6" y="0" width="6" height="6" fill="#D4E8FF"/>
      <rect x="0" y="6" width="6" height="6" fill="#D4E8FF"/>
    </pattern>

    <!-- Flower petals gradient -->
    <radialGradient id="roseGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#F5D5B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A574;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Light blue gingham background -->
  <rect width="200" height="200" fill="url(#gingham)"/>

  <!-- Circular background for depth -->
  <circle cx="100" cy="100" r="95" fill="#F0F8FF" opacity="0.7"/>

  <!-- Background decorative circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#ADD8E6" stroke-width="2" opacity="0.5"/>

  <!-- Large dark N in background -->
  <text x="100" y="130" font-family="cursive" font-size="110" font-weight="bold" text-anchor="middle" fill="#2B5A8E" opacity="0.25" letter-spacing="-3">N</text>

  <!-- Ribbon at bottom front -->
  <g>
    <!-- Left ribbon tail -->
    <path d="M 50 110 Q 45 115 50 125 L 65 120 Q 60 110 50 110 Z" fill="#F5F1E8" stroke="#3D5A7E" stroke-width="1"/>

    <!-- Right ribbon tail -->
    <path d="M 150 110 Q 155 115 150 125 L 135 120 Q 140 110 150 110 Z" fill="#F5F1E8" stroke="#3D5A7E" stroke-width="1"/>

    <!-- Main ribbon -->
    <ellipse cx="100" cy="115" rx="50" ry="18" fill="#F5F1E8" stroke="#3D5A7E" stroke-width="1.5"/>

    <!-- Ribbon highlight for dimension -->
    <ellipse cx="100" cy="110" rx="50" ry="8" fill="white" opacity="0.4"/>
  </g>

  <!-- Left side flowers -->
  <g>
    <!-- Large hydrangea cluster left -->
    <g opacity="0.9">
      <!-- Main petals -->
      <circle cx="35" cy="70" r="4" fill="#7BA3D8"/>
      <circle cx="32" cy="78" r="4" fill="#7BA3D8"/>
      <circle cx="40" cy="82" r="4" fill="#7BA3D8"/>
      <circle cx="48" cy="78" r="3.5" fill="#7BA3D8"/>
      <circle cx="40" cy="90" r="3.5" fill="#7BA3D8"/>
      <circle cx="35" cy="85" r="3" fill="#5A7FA8"/>
      <circle cx="45" cy="88" r="3" fill="#5A7FA8"/>
      <!-- Smaller accent petals -->
      <circle cx="37" cy="75" r="2.5" fill="#5A7FA8" opacity="0.8"/>
      <circle cx="42" cy="80" r="2.5" fill="#5A7FA8" opacity="0.8"/>
    </g>

    <!-- Small rose left -->
    <g transform="translate(28, 95)">
      <circle cx="0" cy="0" r="4" fill="url(#roseGradient)"/>
      <circle cx="-2.5" cy="-1.5" r="2.5" fill="#F5D5B0"/>
      <circle cx="2.5" cy="-1.5" r="2.5" fill="#F5D5B0"/>
      <circle cx="0" cy="2" r="2" fill="#C49060"/>
    </g>

    <!-- Leaves left -->
    <ellipse cx="25" cy="85" rx="5" ry="8" fill="#6B9E7F" transform="rotate(-30 25 85)" opacity="0.8"/>
    <ellipse cx="20" cy="75" rx="4" ry="7" fill="#8FB59E" transform="rotate(45 20 75)" opacity="0.7"/>
  </g>

  <!-- Right side flowers -->
  <g>
    <!-- Large hydrangea cluster right -->
    <g opacity="0.9">
      <!-- Main petals -->
      <circle cx="165" cy="70" r="4" fill="#7BA3D8"/>
      <circle cx="168" cy="78" r="4" fill="#7BA3D8"/>
      <circle cx="160" cy="82" r="4" fill="#7BA3D8"/>
      <circle cx="152" cy="78" r="3.5" fill="#7BA3D8"/>
      <circle cx="160" cy="90" r="3.5" fill="#7BA3D8"/>
      <circle cx="165" cy="85" r="3" fill="#5A7FA8"/>
      <circle cx="155" cy="88" r="3" fill="#5A7FA8"/>
      <!-- Smaller accent petals -->
      <circle cx="163" cy="75" r="2.5" fill="#5A7FA8" opacity="0.8"/>
      <circle cx="158" cy="80" r="2.5" fill="#5A7FA8" opacity="0.8"/>
    </g>

    <!-- Small rose right -->
    <g transform="translate(172, 95)">
      <circle cx="0" cy="0" r="4" fill="url(#roseGradient)"/>
      <circle cx="-2.5" cy="-1.5" r="2.5" fill="#F5D5B0"/>
      <circle cx="2.5" cy="-1.5" r="2.5" fill="#F5D5B0"/>
      <circle cx="0" cy="2" r="2" fill="#C49060"/>
    </g>

    <!-- Leaves right -->
    <ellipse cx="175" cy="85" rx="5" ry="8" fill="#6B9E7F" transform="rotate(30 175 85)" opacity="0.8"/>
    <ellipse cx="180" cy="75" rx="4" ry="7" fill="#8FB59E" transform="rotate(-45 180 75)" opacity="0.7"/>
  </g>

  <!-- Top accent flowers -->
  <g opacity="0.85">
    <!-- Top left small flower -->
    <circle cx="60" cy="25" r="3.5" fill="#A8D5E2"/>
    <circle cx="57" cy="27" r="2" fill="#7BA3D8"/>
    <circle cx="60" cy="29" r="2" fill="#7BA3D8"/>
    <circle cx="63" cy="27" r="2" fill="#7BA3D8"/>
    <!-- Center -->
    <circle cx="60" cy="27" r="1" fill="#5A7FA8"/>

    <!-- Top right small flower -->
    <circle cx="140" cy="25" r="3.5" fill="#A8D5E2"/>
    <circle cx="143" cy="27" r="2" fill="#7BA3D8"/>
    <circle cx="140" cy="29" r="2" fill="#7BA3D8"/>
    <circle cx="137" cy="27" r="2" fill="#7BA3D8"/>
    <!-- Center -->
    <circle cx="140" cy="27" r="1" fill="#5A7FA8"/>
  </g>

  <!-- Center top accent -->
  <g opacity="0.7">
    <circle cx="100" cy="20" r="2.5" fill="#F5D5B0"/>
    <circle cx="100" cy="20" r="1.5" fill="#D4A574" opacity="0.7"/>
  </g>

  <!-- Decorative dots around circle -->
  <g fill="#ADD8E6" opacity="0.6">
    <circle cx="100" cy="10" r="1.5"/>
    <circle cx="155" cy="30" r="1"/>
    <circle cx="185" cy="60" r="1.2"/>
    <circle cx="190" cy="100" r="1.5"/>
    <circle cx="185" cy="140" r="1"/>
    <circle cx="155" cy="170" r="1.2"/>
    <circle cx="100" cy="190" r="1.5"/>
    <circle cx="45" cy="170" r="1"/>
    <circle cx="15" cy="140" r="1.2"/>
    <circle cx="10" cy="100" r="1.5"/>
    <circle cx="15" cy="60" r="1"/>
    <circle cx="45" cy="30" r="1.2"/>
  </g>

  <!-- Outer decorative circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#ADD8E6" stroke-width="1.5" opacity="0.7"/>
</svg>