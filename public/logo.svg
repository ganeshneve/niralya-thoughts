<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left decorative flourish -->
  <g opacity="0.7">
    <path d="M 15 45 Q 10 50 12 60 Q 14 70 20 72" stroke="#9ca3af" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="18" cy="48" r="2.5" fill="#9ca3af" opacity="0.6"/>
    <circle cx="15" cy="58" r="2" fill="#9ca3af" opacity="0.5"/>
    <path d="M 20 40 L 25 42 L 23 48" stroke="#d1d5db" stroke-width="1" fill="none"/>
  </g>

  <!-- Central M letter -->
  <text x="60" y="85" font-family="Georgia, serif" font-size="72" font-weight="bold" text-anchor="middle" fill="url(#logoGradient)" letter-spacing="-2">M</text>

  <!-- Right decorative flourish -->
  <g opacity="0.7">
    <path d="M 105 45 Q 110 50 108 60 Q 106 70 100 72" stroke="#9ca3af" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="102" cy="48" r="2.5" fill="#9ca3af" opacity="0.6"/>
    <circle cx="105" cy="58" r="2" fill="#9ca3af" opacity="0.5"/>
    <path d="M 100 40 L 95 42 L 97 48" stroke="#d1d5db" stroke-width="1" fill="none"/>
  </g>

  <!-- Top decorative accent -->
  <g opacity="0.5">
    <path d="M 35 20 Q 40 18 45 20" stroke="#9ca3af" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M 75 20 Q 80 18 85 20" stroke="#9ca3af" stroke-width="1" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="22" r="1.5" fill="#9ca3af"/>
    <circle cx="80" cy="22" r="1.5" fill="#9ca3af"/>
  </g>

  <!-- Bottom decorative accent -->
  <g opacity="0.5">
    <path d="M 40 100 Q 45 102 50 100" stroke="#d1d5db" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M 70 100 Q 75 102 80 100" stroke="#d1d5db" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Subtle border circle -->
  <circle cx="60" cy="60" r="55" stroke="#e5e7eb" stroke-width="0.5" fill="none" opacity="0.4"/>
</svg>